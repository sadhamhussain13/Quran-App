<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Qur'an App</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Qur'an</h1>

        <p class="subtitle">
            Read the Qur'an with Arabic text and English translation
        </p>

        <div class="search-section">

    <h2>Search Qur'an</h2>

    <input
        type="text"
        id="searchInput"
        placeholder="Search English translation..."
    >

    <button id="searchButton">
        Search
    </button>

</div>

<div id="searchResults"></div>

        <label for="surahSelect">
            Select Surah
        </label>

        <select id="surahSelect">
            <option value="">Select a Surah</option>
        </select>

        <label for="ayahSelect">
            Select Ayah
        </label>

        <select id="ayahSelect" disabled>
            <option value="">Select an Ayah</option>
        </select>

        <button id="loadAyah">
            Read Ayah
        </button>

        <div id="surahInfo"></div>

        <div id="verses"></div>


        <div id="surahInfo"></div>

        <div id="verses"></div>

    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>

</body>

</html>
