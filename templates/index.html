<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qur'an App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <main class="container">
        <header class="app-header">
            <h1>Qur'an</h1>
            <p class="subtitle">“Indeed, in the remembrance of Allah do hearts find rest.”
— Qur’an 13:28</p>
        </header>

        <nav class="mode-toggle" aria-label="Qur'an mode">
            <button id="readModeButton" class="mode-button active" type="button">
                📖 Read
            </button>
            <button id="searchModeButton" class="mode-button" type="button">
                🔎 Search
            </button>
        </nav>

        <section id="readPanel" class="mode-panel active-panel">
            <div class="control-section">
                <div class="panel-header">
                    <h2>Read Qur'an</h2>
                    <p>Select a Surah and Ayah to read.</p>
                </div>

                <div class="read-controls">
                    <div class="form-group">
                        <label for="surahSelect">Surah</label>
                        <select id="surahSelect">
                            <option value="">Select a Surah</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="ayahSelect">Ayah</label>
                        <select id="ayahSelect" disabled>
                            <option value="">Select an Ayah</option>
                        </select>
                    </div>

                    <button id="loadAyah" type="button">Read Ayah</button>
                    <button id="clearRead" class="secondary-button" type="button">
                        Clear
                    </button>
                </div>
            </div>

            <div id="readContent">
                <div id="surahInfo"></div>
                <div id="verses"></div>
            </div>
        </section>

        <section id="searchPanel" class="mode-panel">
            <div class="control-section">
                <div class="panel-header">
                    <h2>Search Qur'an</h2>
                    <p>Search the English translation.</p>
                </div>

                <div class="search-controls">
                    <div class="form-group">
                        <label for="searchInput">Search</label>
                        <input
                            type="text"
                            id="searchInput"
                            placeholder="Search for a word..."
                            autocomplete="off"
                        >
                    </div>

                    <div class="form-group">
                        <label for="searchSurah">Surah</label>
                        <select id="searchSurah">
                            <option value="">All Surahs</option>
                        </select>
                    </div>

                    <div class="search-actions">
                        <button id="searchButton" type="button">Search</button>
                        <button id="clearButton" class="secondary-button" type="button">
                            Clear
                        </button>
                    </div>
                </div>
            </div>

            <div id="searchResults"></div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
